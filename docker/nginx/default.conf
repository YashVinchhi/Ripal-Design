server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 460M;
    autoindex off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/xhtml+xml;

    error_page 404 /public/404.php;

    location ~* ^/(?:\.env|\.git|composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml(?:\.dist)?|.*\.(?:sql|bak|backup|old|orig|swp|log))$ {
        deny all;
    }

    location ~* (^|/)(?:config|db|database|settings)\.php$ {
        deny all;
    }

    location ~* ^/(phpmyadmin|pma|mysql|db)(/|$) {
        deny all;
    }

    location ~* ^/(app|sql|Common|includes|scripts|logs|storage|stubs|tests|vendor)/ {
        deny all;
    }

    location ~* ^/uploads/.*\.(?:php[0-9]?|phtml|phar|pl|py|cgi|asp|aspx|jsp|sh|bash)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /public/index.php?$query_string;
    }

    location ~* ^/walkthroughs/([A-Za-z0-9-]+)/([A-Za-z0-9-]+)/?$ {
        rewrite ^/walkthroughs/([A-Za-z0-9-]+)/([A-Za-z0-9-]+)/?$ /public/walkthrough.php?project_slug=$1&model_slug=$2 last;
    }

    location ~* ^/walkthrough-assets/([A-Za-z0-9-]+)/([A-Za-z0-9-]+)/model\.glb$ {
        rewrite ^/walkthrough-assets/([A-Za-z0-9-]+)/([A-Za-z0-9-]+)/model\.glb$ /public/walkthrough_asset.php?project_slug=$1&model_slug=$2 last;
    }

    location ~* ^/projects/([A-Za-z0-9-]+)/?$ {
        rewrite ^/projects/([A-Za-z0-9-]+)/?$ /public/project_view.php?slug=$1 last;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_ADMIN_VALUE "open_basedir=/var/www/html/:/tmp/:/proc/";
        fastcgi_read_timeout 600;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
