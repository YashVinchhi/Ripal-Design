<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Header Test</title>
<style>
:root{--rd-logged-header-max:5vh}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#f7f5f4}
nav.alt-header{height:var(--rd-logged-header-max);max-height:var(--rd-logged-header-max);display:flex;align-items:center;padding:0 1rem;gap:1rem;box-sizing:border-box !important;-webkit-box-sizing:border-box !important;background:transparent}
nav.alt-header .alt-logo img{height:calc(var(--rd-logged-header-max)-0.6rem)}
.alt-main-menu{display:flex;gap:0.75rem;align-items:center;margin-left:1rem;white-space:nowrap}
.alt-main-menu a{color:#222;text-decoration:none;text-transform:uppercase;font-weight:600;font-size:0.85rem;padding:0.35rem 0.75rem;border-radius:4px}
.alt-toolbar{position:fixed;top:var(--rd-logged-header-max);left:0;right:0;height:10vh;min-height:80px;display:flex;align-items:center;gap:0.75rem;padding:0 1rem;background:rgba(255,255,255,0.98);border-bottom:1px solid rgba(15,23,42,0.06);z-index:999}
.toolbar-actions{margin-left:auto;display:flex;gap:0.5rem}
.toolbar-btn{padding:8px;border-radius:6px;border:1px solid rgba(15,23,42,0.06);background:transparent;color:#374151}
.btn-new{background:linear-gradient(90deg,#b85c3b,#7a2f20);color:#fff;border:none}
.container{padding:120px 2rem}
.card{width:240px;height:220px;background:#fff;border-radius:6px;box-shadow:0 6px 18px rgba(16,24,40,0.06);display:inline-block;margin:12px;padding:12px}
</style>
</head>
<body>
<nav class="alt-header">
  <div class="alt-logo">
    <a href="#"><img src="/assets/images/rd-placeholder.svg" alt="logo"></a>
  </div>
  <div class="alt-main-menu" role="navigation">
    <a href="#">DASHBOARD</a>
    <a href="#">PORTFOLIO</a>
    <a href="#">USER CONTROLS</a>
    <a href="#">LEAVE MANAGER</a>
    <a href="#">FINANCIAL GATEWAY</a>
    <a href="#">CONTENT</a>
    <a href="#">MESSAGES</a>
  </div>
</nav>
<div class="alt-toolbar" role="region" aria-label="Admin tools">
  <div class="toolbar-group toolbar-region" style="margin-left:8px"><span class="toolbar-label">REGION</span>
    <div style="display:flex;gap:6px;margin-left:8px">
      <button class="seg-btn active">GLOBAL</button>
      <button class="seg-btn">RAJKOT</button>
      <button class="seg-btn">JAM</button>
    </div>
  </div>
  <div style="margin-left:12px;">
    <button id="addProjectBtn" class="toolbar-btn">+ Add New</button>
    <button id="editProjectBtn" class="toolbar-btn">Edit</button>
    <button id="deleteProjectBtn" class="toolbar-btn">Delete</button>
  </div>
  <div class="toolbar-region-select" style="margin-left:12px">
    <label for="regionSelect" style="margin-right:6px">Region</label>
    <select id="regionSelect" class="styled-select"><option>Global</option><option>Rajkot</option><option>Jam Khambhalia</option></select>
  </div>
  <div class="toolbar-group toolbar-search" style="margin-left:12px;flex:1;max-width:520px">
    <input id="projectSearchHeader" type="search" placeholder="Search Master Registry..." style="width:100%;padding:8px 12px;border-radius:6px;border:1px solid rgba(15,23,42,0.06)">
  </div>
  <div style="margin-left:8px">
    <button id="selectAllBtn" class="toolbar-btn">Select All</button>
  </div>
  <div style="margin-left:8px;position:relative">
    <button id="filterSortBtn" class="toolbar-btn">Filter / Sort</button>
    <div id="filterSortPanel" style="display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid rgba(15,23,42,0.06);box-shadow:0 6px 18px rgba(16,24,40,0.06);padding:12px;border-radius:6px;min-width:240px">
      <div style="font-weight:600;margin-bottom:8px">Filter</div>
      <label style="display:block">Progress<select style="width:100%;margin-top:6px"><option>Any</option><option>0-25%</option><option>25-50%</option></select></label>
      <label style="display:block;margin-top:8px">Worker<input style="width:100%;margin-top:6px"></label>
      <div style="margin-top:10px;font-weight:600">Sort By</div>
      <select style="width:100%;margin-top:6px"><option>Progress (High → Low)</option><option>Progress (Low → High)</option></select>
    </div>
  </div>
</div>
<div class="container">
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
</div>
</body>
</html>
